<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 유튜브 서고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div style="text-align:right;">
      <button id="themeToggle" style="background:var(--hover);color:var(--text);border:none;padding:5px 10px;border-radius:15px;cursor:pointer;font-size:12px;">테마 변경</button>
    </div>
    <div class="eyebrow">Google OAuth · Liked · Playlists · Subscriptions · Search · Comments</div>
    <h1>내 유튜브 서고 <span id="buildTime" style="font-size:12px; color:var(--text-dim); vertical-align:middle;"></span></h1>
    <p class="sub">Google 로그인으로 내 서고, 유튜브 전체 검색, 작성 댓글, 싫어요 목록 및 국가별 인기 영상까지 한 곳에서 관리합니다.</p>
  </header>

  <div class="desk">
    <h2>Google 계정으로 로그인</h2>
    <div class="field" style="display:none;">
      <label for="clientIdInput">OAuth 클라이언트 ID</label>
      <input type="text" id="clientIdInput" value="654010223092-aqucn2vtp4kg8ltnrbm7042g4bmifqp9.apps.googleusercontent.com" autocomplete="off">
    </div>
    
    <div id="accountContainer" style="margin-bottom: 15px; display: none;">
        <label for="accountSelect">저장된 계정:</label>
        <select id="accountSelect" style="width:100%;padding:10px;border-radius:8px;background:var(--bg);color:var(--text);border:1px solid var(--text-dim);">
        </select>
    </div>

    <p style="font-size:13px; color:#5a4e38; margin-top:0; margin-bottom:14px;">버튼을 누르면 Google 로그인 창이 나타나며, 내 유튜브 서고에 접근합니다.</p>
    <div class="btn-row">
      <button class="primary" id="loginBtn">Google로 로그인</button>
      <button class="ghost" id="logoutBtn" style="display:none;">로그아웃</button>
    </div>
    <div class="status-line" id="statusLine"></div>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="err-msg" id="errMsg"></div>
  </div>

  <div class="tabbar" id="tabbar">
    <button data-tab="all" class="active">전체보기</button>
    <button data-tab="liked">좋아요</button>
    <button data-tab="disliked">👎 싫어요</button>
    <button data-tab="playlists">재생목록</button>
    <button data-tab="subscriptions">구독</button>
    <button data-tab="search">🔍 전체 검색</button>
    <button data-tab="comments">💬 내 댓글 ↗</button>
    <button data-tab="trending">🔥 인기 급상승</button>
  </div>

  <div class="stats-container" id="statsContainer">
    <div class="stats" id="stats"></div>
    <div class="refresh-container" style="text-align:center; margin-bottom: 20px;">
        <button id="refreshBtn" style="background:var(--hover);color:var(--text);border:none;padding:5px 15px;border-radius:15px;cursor:pointer;">🔄 데이터 새로고침</button>
    </div>
  </div>

  <div class="controls" id="controls">
      <input type="text" id="searchInput" placeholder="검색...">
      <input type="text" id="channelQueryInput" placeholder="채널 내 동영상 검색어..." style="display:none;">
      <select id="regionSelect" style="display:none;">
          <option value="KR">🇰🇷 대한민국</option>
          <option value="US">🇺🇸 미국</option>
          <option value="JP">🇯🇵 일본</option>
          <option value="GB">🇬🇧 영국</option>
          <option value="TW">🇹🇼 대만</option>
      </select>
      <select id="sortSelect"></select>
      <select id="navModeSelect">
        <option value="scroll" selected>스크롤</option>
        <option value="pagination">페이지</option>
      </select>
      <button id="saveDataBtn" style="background:var(--hover);color:var(--text);border:none;padding:5px 10px;border-radius:15px;cursor:pointer;">💾 데이터 저장</button>
  </div>

  <div class="meta-row" id="metaRow">
    <span class="left" id="metaLeft"><span id="resultCount">0건 결과</span></span>
    <button id="resetBtn">로그아웃 및 전환</button>
  </div>

  <div class="pager" id="pagerTop" style="justify-content:center; margin-bottom:10px;"></div>
  <div id="list"></div>
  <div class="empty-hint" id="emptyHint"></div>
  <div class="pager" id="pager"></div>

  <footer>
    이 앱은 youtube.readonly 및 youtube.force-ssl 권한을 요청합니다.
  </footer>
</div>

<script src="script.js" defer></script>
</body>
</html>
