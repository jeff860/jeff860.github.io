<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Youtube Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div style="text-align:right;">
      <button id="langToggle" style="background:var(--hover);color:var(--text);border:none;padding:5px 10px;border-radius:15px;cursor:pointer;font-size:12px;margin-right:6px;"><b>한글</b> / English</button>
      <button id="themeToggle" data-i18n="theme" style="background:var(--hover);color:var(--text);border:none;padding:5px 10px;border-radius:15px;cursor:pointer;font-size:12px;">테마 변경</button>
    </div>
    <h1>My Youtube Search</h1>
    </header>

  <div class="desk">
    <h2>My YouTube</h2>
    <div class="field" style="display:none;">
      <label for="clientIdInput">OAuth 클라이언트 ID</label>
      <input type="text" id="clientIdInput" value="654010223092-aqucn2vtp4kg8ltnrbm7042g4bmifqp9.apps.googleusercontent.com" autocomplete="off">
    </div>
    
    <div id="accountContainer" style="margin-bottom: 15px; display: none;">
        <div id="storageInfoNote" data-i18n-html="note_html" style="font-size:11px; color:var(--text-dim); margin:0 0 12px 0;">
          🧠 <b>임시 데이터</b>: 탭/브라우저를 닫으면 삭제됨 &nbsp;·&nbsp; 📦 <b>저장된 데이터</b>: 이 기기 브라우저에 저장됨 (삭제 전까지 이 PC의 다른 사용자도 볼 수 있음)
        </div>
        <div id="savedAccountsSection">
            <label data-i18n="data_label">데이터:</label>
            <div id="accountList" style="margin-top: 10px;"></div>
        </div>
    </div>

    <p data-i18n="intro" style="font-size:13px; color:#5a4e38; margin-top:0; margin-bottom:14px;">불러오기 버튼을 누르면 Google 로그인 창이 나타나며, 내 유튜브 서고에 접근합니다.</p>
    <div class="btn-row">
      <button class="primary" id="loginBtn" data-i18n="load">불러오기</button>
      <button class="danger-btn" id="deleteDbBtn" data-i18n="del_db" style="display:none;">현재 계정 DB 삭제</button>
    </div>
    <div class="status-line" id="statusLine"></div>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="err-msg" id="errMsg"></div>
  </div>

  <div class="tabbar" id="tabbar">
    <button data-i18n="tab_all" data-tab="all" class="active">전체보기</button>
    <button data-i18n="tab_liked" data-tab="liked">좋아요</button>
    <button data-i18n="tab_disliked" data-tab="disliked">👎 싫어요</button>
    <button data-i18n="tab_playlists" data-tab="playlists">재생목록</button>
    <button data-i18n="tab_subs" data-tab="subscriptions">구독</button>
    <button data-i18n="tab_comments" data-tab="comments">💬 내 댓글 ↗</button>
  </div>

  <div class="stats-container" id="statsContainer">
    <div class="stats" id="stats"></div>
  </div>

  <div class="controls" id="controls">
      <input type="text" id="searchInput" data-i18n-ph="ph_search" placeholder="검색...">
      <input type="text" id="channelQueryInput" data-i18n-ph="ph_channel_q" placeholder="채널 내 동영상 검색어..." style="display:none;">
      <select id="sortSelect"></select>
      <select id="navModeSelect">
        <option value="scroll" data-i18n="nav_scroll" selected>스크롤</option>
        <option value="pagination" data-i18n="nav_pages">페이지</option>
      </select>
      <button id="saveDataBtn" data-i18n="export" style="background:var(--hover);color:var(--text);border:none;padding:5px 10px;border-radius:15px;cursor:pointer;">💾 데이터 저장</button>
  </div>

  <div class="meta-row" id="metaRow">
    <span class="left" id="metaLeft"><span id="resultCount" data-i18n="zero_results">0건 결과</span></span>
    <span id="dataSourceBadge" class="source-badge"></span>
  </div>

  <div class="pager" id="pagerTop" style="justify-content:center; margin-bottom:10px;"></div>
  <div id="list"></div>
  <div class="empty-hint" id="emptyHint"></div>
  <div class="pager" id="pager"></div>

  <footer data-i18n="footer">
    이 앱은 youtube.readonly(읽기 전용) 권한만 요청합니다.
  </footer>
</div>

<script src="script.js" defer></script>
</body>
</html>
